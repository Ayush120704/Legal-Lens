services:
  - type: web
    name: legallens-backend
    env: python
    region: oregon
    # Memory pressure: PyTorch + ChromaDB + sentence-transformers use ~300-400MB.
    # If you hit memory limits, upgrade to starter (1GB) or professional (2GB+).
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PRODUCTION
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://ailegalanalyzer.vercel.app
      - key: DATABASE_URL
        value: sqlite:///./legal_analyzer.db
      - key: OPENAI_API_KEY
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: MAX_TEXT_LENGTH
        value: "100000"
      - key: JOB_CLEANUP_HOURS
        value: "24"
